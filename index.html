<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="个人每日成果记录与趋势看板">
  <title>每日成果</title>
  <style>
    :root{color-scheme:light;--ink:#17211b;--muted:#69746d;--line:#dce2dc;--paper:#f7f7f2;--panel:#fff;--green:#256c4b;--green2:#a9ceb9;--lime:#e5efcf;--orange:#e28a52;--shadow:0 18px 50px rgba(29,48,37,.08)}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"PingFang SC",sans-serif}
    button,input,textarea,select{font:inherit}.shell{max-width:1180px;margin:auto;padding:28px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:26px}.brand{display:flex;align-items:center;gap:12px}.mark{width:38px;height:38px;border-radius:12px;background:var(--green);color:white;display:grid;place-items:center;font-weight:800}.brand h1{font:700 22px/1.1 Georgia,serif;margin:0}.brand p{margin:4px 0 0;color:var(--muted);font-size:12px}.actions{display:flex;gap:8px}.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:9px 13px;border-radius:10px;cursor:pointer}.btn.primary{border-color:var(--green);background:var(--green);color:#fff}.hero{display:grid;grid-template-columns:1.5fr .85fr;gap:18px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}.main{padding:28px}.eyebrow{font-size:12px;color:var(--green);font-weight:700;letter-spacing:.08em;text-transform:uppercase}.date{margin:8px 0 4px;font:700 clamp(28px,5vw,46px)/1.1 Georgia,serif}.sub{margin:0;color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:30px}.stat{padding:15px;background:#f8faf7;border-radius:14px}.stat b{display:block;font:700 26px/1.1 Georgia,serif}.stat span{font-size:12px;color:var(--muted)}.checkin{padding:22px;background:var(--green);color:white}.checkin h2{margin:0 0 5px;font:700 20px Georgia,serif}.checkin p{color:#dbeadf;margin:0 0 18px;font-size:13px}.checkin label{display:block;font-size:12px;margin:12px 0 5px}.checkin input,.checkin textarea,.checkin select{width:100%;border:0;border-radius:9px;background:#fff;color:var(--ink);padding:10px}.checkin textarea{min-height:72px;resize:vertical}.checkin .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.checkin button{width:100%;margin-top:16px;background:var(--lime);color:#173c2b;border:0;border-radius:10px;padding:11px;font-weight:700;cursor:pointer}.grid{display:grid;grid-template-columns:1.25fr .75fr;gap:18px;margin-top:18px}.section{padding:22px}.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.section h2{font:700 18px Georgia,serif;margin:0}.section small{color:var(--muted)}.bars{height:190px;display:flex;align-items:end;gap:12px;border-bottom:1px solid var(--line);padding:8px 5px 0}.bar-wrap{height:100%;flex:1;display:flex;flex-direction:column;justify-content:end;align-items:center;gap:7px}.bar{width:min(38px,65%);min-height:5px;background:var(--green2);border-radius:8px 8px 2px 2px;position:relative}.bar.today{background:var(--green)}.bar i{position:absolute;top:-22px;left:50%;transform:translateX(-50%);font-style:normal;font-size:11px;color:var(--ink)}.bar-wrap label{font-size:11px;color:var(--muted)}.cats{display:grid;gap:13px}.cat-line{display:grid;grid-template-columns:72px 1fr 28px;align-items:center;gap:10px;font-size:13px}.track{height:8px;background:#edf0ec;border-radius:99px;overflow:hidden}.fill{height:100%;border-radius:99px;background:var(--green)}.timeline{margin-top:18px}.item{display:grid;grid-template-columns:10px 1fr auto;gap:12px;padding:14px 0;border-top:1px solid var(--line)}.dot{width:9px;height:9px;border-radius:50%;background:var(--orange);margin-top:7px}.item b{display:block}.item p{margin:2px 0 0;color:var(--muted);font-size:12px}.tag{align-self:start;background:var(--lime);padding:4px 8px;border-radius:99px;font-size:11px}.empty{padding:34px 0;text-align:center;color:var(--muted)}.file-input{display:none}
    @media(max-width:780px){.shell{padding:16px}.top{align-items:flex-start}.actions{flex-wrap:wrap;justify-content:flex-end}.hero,.grid{grid-template-columns:1fr}.main{padding:22px}.stats{grid-template-columns:repeat(3,1fr)}.checkin{order:-1}}
    @media(max-width:430px){.brand p{display:none}.actions .btn{padding:8px 9px;font-size:12px}.stats{gap:6px}.stat{padding:12px 9px}.stat b{font-size:22px}.checkin .row{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="top"><div class="brand"><div class="mark">✓</div><div><h1>每日成果</h1><p>把完成过的事，变成看得见的进步</p></div></div><div class="actions"><button class="btn" id="importBtn">导入</button><button class="btn" id="exportBtn">导出</button><button class="btn primary" id="focusBtn">记录成果</button><input class="file-input" id="fileInput" type="file" accept="application/json"></div></header>
    <section class="hero">
      <article class="panel main"><div class="eyebrow">Today · 今日</div><h2 class="date" id="dateText"></h2><p class="sub" id="greeting">今天的努力，值得被认真记录。</p><div class="stats"><div class="stat"><b id="todayCount">0</b><span>今日完成</span></div><div class="stat"><b id="todayImpact">0</b><span>交付与突破</span></div><div class="stat"><b id="streak">0</b><span>连续完成</span></div></div></article>
      <aside class="panel checkin" id="checkin"><h2>记下一项成果</h2><p>不必宏大，推进了一小步也算。</p><form id="entryForm"><label for="task">完成了什么？</label><textarea id="task" required placeholder="例如：完成了项目首页的交互原型"></textarea><div class="row"><div><label for="status">完成状态</label><select id="status"><option value="done">已完成</option><option value="partial">部分完成</option><option value="dropped">已放弃</option></select></div><div><label for="category">类别</label><select id="category"><option>工作</option><option>学习</option><option>健康</option><option>生活</option><option>创作</option><option>其他</option></select></div></div><div class="row"><div><label for="value">成果类型</label><select id="value"><option>推进</option><option>交付</option><option>突破</option><option>学习</option><option>维护</option></select></div><div><label for="effort">工作量</label><select id="effort"><option value="1">小</option><option value="2" selected>中</option><option value="3">大</option></select></div></div><div class="row"><div><label for="minutes">投入分钟（可选）</label><input id="minutes" type="number" min="0" step="5" placeholder="可以不填"></div><div><label for="note">成果或影响（可选）</label><input id="note" placeholder="例如：交付给开发评审"></div></div><button type="submit">保存这项成果</button></form></aside>
    </section>
    <section class="grid">
      <article class="panel section"><div class="section-head"><h2>最近 7 天</h2><small>已完成事项数</small></div><div class="bars" id="bars"></div></article>
      <article class="panel section"><div class="section-head"><h2>本周成果类型</h2><small id="weekTotal">共 0 项完成</small></div><div class="cats" id="cats"></div></article>
    </section>
    <section class="panel section timeline"><div class="section-head"><h2>最近成果</h2><small>保存在当前浏览器</small></div><div id="items"></div></section>
  </main>
  <script>
    const KEY='daily-achievements-v1';
    let data=JSON.parse(localStorage.getItem(KEY)||'[]');
    const $=s=>document.querySelector(s), dayKey=d=>new Date(d).toLocaleDateString('sv-SE'), today=()=>dayKey(new Date());
    const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}
    function render(){
      const now=new Date(), fmt=new Intl.DateTimeFormat('zh-CN',{month:'long',day:'numeric',weekday:'long'}); $('#dateText').textContent=fmt.format(now);
      const isDone=x=>(x.status||'done')==='done', done=data.filter(isDone), td=done.filter(x=>dayKey(x.date)===today()); $('#todayCount').textContent=td.length; $('#todayImpact').textContent=td.filter(x=>['交付','突破'].includes(x.value)).length;
      const days=new Set(done.map(x=>dayKey(x.date))); let streak=0,d=new Date(); while(days.has(dayKey(d))){streak++;d.setDate(d.getDate()-1)} $('#streak').textContent=streak;
      const seven=[...Array(7)].map((_,i)=>{const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()-6+i);return d}); const counts=seven.map(d=>done.filter(x=>dayKey(x.date)===dayKey(d)).length), max=Math.max(1,...counts);
      $('#bars').innerHTML=seven.map((d,i)=>`<div class="bar-wrap"><div class="bar ${i===6?'today':''}" style="height:${Math.max(4,counts[i]/max*100)}%"><i>${counts[i]}</i></div><label>${['日','一','二','三','四','五','六'][d.getDay()]}</label></div>`).join('');
      const start=dayKey(seven[0]), week=done.filter(x=>dayKey(x.date)>=start), grouped={}; week.forEach(x=>{const k=x.value||'推进';grouped[k]=(grouped[k]||0)+1}); $('#weekTotal').textContent=`共 ${week.length} 项完成`;
      $('#cats').innerHTML=Object.entries(grouped).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="cat-line"><span>${esc(k)}</span><div class="track"><div class="fill" style="width:${v/Math.max(1,week.length)*100}%"></div></div><b>${v}</b></div>`).join('')||'<div class="empty">记录后，这里会出现分类趋势</div>';
      const statusText={done:'已完成',partial:'部分完成',dropped:'已放弃'},effortText={1:'小',2:'中',3:'大'};
      $('#items').innerHTML=[...data].sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,8).map(x=>{const meta=[new Date(x.date).toLocaleDateString('zh-CN'),x.value||'推进',`${effortText[x.effort||2]}工作量`,(+x.minutes||0)?`${+x.minutes} 分钟`:null,x.note||null].filter(Boolean).map(esc).join(' · ');return `<div class="item"><span class="dot"></span><div><b>${esc(x.task)}</b><p>${meta}</p></div><span class="tag">${statusText[x.status||'done']} · ${esc(x.category)}</span></div>`}).join('')||'<div class="empty">今天完成了什么？从右上角记录第一项吧。</div>';
    }
    $('#entryForm').addEventListener('submit',e=>{e.preventDefault();data.push({id:crypto.randomUUID(),date:new Date().toISOString(),task:$('#task').value.trim(),status:$('#status').value,category:$('#category').value,value:$('#value').value,effort:+$('#effort').value,minutes:+$('#minutes').value||0,note:$('#note').value.trim()});save();e.target.reset();$('#effort').value='2';$('#task').focus()});
    $('#focusBtn').onclick=()=>{$('#checkin').scrollIntoView({behavior:'smooth'});setTimeout(()=>$('#task').focus(),350)};
    $('#exportBtn').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download=`daily-achievements-${today()}.json`;a.click();URL.revokeObjectURL(a.href)};
    $('#importBtn').onclick=()=>$('#fileInput').click(); $('#fileInput').onchange=async e=>{try{const parsed=JSON.parse(await e.target.files[0].text());if(!Array.isArray(parsed))throw 0;data=parsed;save()}catch{alert('无法导入：请选择由本工具导出的 JSON 文件。')}e.target.value=''};
    render();
  </script>
</body>
</html>
